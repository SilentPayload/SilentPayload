name: folio

on:
  push:
    paths: ['data/**', 'scripts/**', 'folio/**', 'README.md']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the generated profile
        run: python3 scripts/check_folio.py